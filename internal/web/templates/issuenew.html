{{define "title"}}new issue · {{.Repo.OwnerName}}/{{.Repo.Name}}{{end}}
{{define "content"}}
{{template "repoheader" .}}
<h2>new issue</h2>
{{if gt (len .Templates) 1}}<p class="meta">template:
{{range .Templates}}{{if eq .Name $.Template}}<strong>{{.Name}}</strong>{{else}}<a href="?template={{.Name}}">{{.Name}}</a>{{end}} {{end}}</p>{{end}}
<form method="post" action="/{{.Repo.OwnerName}}/{{.Repo.Name}}/issues/new" class="commentform">
<p><input type="text" name="title" placeholder="title" required></p>
<p><textarea name="body" rows="12">{{.Body}}</textarea></p>
<p><button type="submit">open issue</button></p>
</form>
{{end}}
