<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 860" width="970" height="860" role="img" aria-labelledby="t d">
<title id="t">5. Authorization decision</title><desc id="d">How a request is authorised: Dispatch gates, then repository resolution with a policy predicate, and the git transport path.</desc>
<style>
text{font-family:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',sans-serif}
.bg{fill:#ffffff}
.t{fill:#1a1a1a;font-size:13px}
.tb1{fill:#1a1a1a;font-size:13px;font-weight:700}
.ts{fill:#4d4d4d;font-size:11px}
.th{fill:#1a1a1a;font-size:17px;font-weight:700}
.m{font-family:'Atkinson Hyperlegible Mono',ui-monospace,Menlo,monospace}
.gb{fill:#eaf0fd;stroke:#1f4fd1;stroke-width:1.4}
.ext{fill:#f3f3f3;stroke:#6b6b6b;stroke-width:1.2}
.act{fill:#ffffff;stroke:#1a1a1a;stroke-width:1.2}
.st{fill:#fff4e8;stroke:#9a3412;stroke-width:1.2}
.bad{fill:#fdecec;stroke:#b42318;stroke-width:1.2}
.ok{fill:#e8f5ec;stroke:#1a7f37;stroke-width:1.2}
.dec{fill:#ffffff;stroke:#1f4fd1;stroke-width:1.4;stroke-dasharray:5 3}
.host{fill:none;stroke:#6b6b6b;stroke-width:1.2;stroke-dasharray:3 3}
.zone{fill:none;stroke:#c2410c;stroke-width:1.6;stroke-dasharray:7 4}
.zl{fill:#c2410c;font-size:12px;font-weight:700}
.tag{fill:#c2410c;font-size:11px;font-weight:700}
.ln{stroke:#1a1a1a;stroke-width:1.2;fill:none}
.lnd{stroke:#6b6b6b;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.life{stroke:#9a9a9a;stroke-width:1;stroke-dasharray:3 4}
.ah{fill:#1a1a1a}
.ahd{fill:#6b6b6b}
@media (prefers-color-scheme: dark){
.bg{fill:#121212}
.t,.tb1,.th{fill:#ececec}
.ts{fill:#b0b0b0}
.gb{fill:#16233f;stroke:#7aa2ff}
.ext{fill:#1e1e1e;stroke:#8a8a8a}
.act{fill:#121212;stroke:#ececec}
.st{fill:#2a1a0e;stroke:#f0a36b}
.bad{fill:#2c1414;stroke:#f28b82}
.ok{fill:#122417;stroke:#6fcf8f}
.dec{fill:#121212;stroke:#7aa2ff}
.host{stroke:#8a8a8a}
.zone{stroke:#fb923c}
.zl,.tag{fill:#fb923c}
.ln{stroke:#ececec}
.lnd{stroke:#9a9a9a}
.life{stroke:#6a6a6a}
.ah{fill:#ececec}
.ahd{fill:#9a9a9a}
}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ahd"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="970" height="860"/>
<text class="th" x="28" y="36">5. Authorization decision</text>
<rect class="act" x="40" y="60" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="78.0" text-anchor="middle">Credential</text>
<text class="ts" x="230.0" y="94.0" text-anchor="middle">SSH key · API token · session cookie</text>
<path class="ln" d="M230.0,104 L230.0,124" marker-end="url(#a)"/>
<rect class="gb" x="40" y="124" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="150.0" text-anchor="middle">Resolve account and scope</text>
<path class="ln" d="M230.0,168 L230.0,188" marker-end="url(#a)"/>
<rect class="dec" x="40" y="188" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="214.0" text-anchor="middle">Scope allows this command?</text>
<path class="ln" d="M420,210 L470,210" marker-end="url(#a)"/>
<text class="ts" x="442" y="204" text-anchor="middle">no</text>
<rect class="bad" x="470" y="192" width="190" height="36" rx="2"/>
<text class="tb1" x="565.0" y="214.0" text-anchor="middle">denied (exit 4)</text>
<path class="ln" d="M230.0,232 L230.0,252" marker-end="url(#a)"/>
<rect class="dec" x="40" y="252" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="278.0" text-anchor="middle">Account disabled?</text>
<path class="ln" d="M420,274 L470,274" marker-end="url(#a)"/>
<text class="ts" x="442" y="268" text-anchor="middle">yes</text>
<rect class="bad" x="470" y="256" width="190" height="36" rx="2"/>
<text class="tb1" x="565.0" y="278.0" text-anchor="middle">denied (exit 4)</text>
<path class="ln" d="M230.0,296 L230.0,316" marker-end="url(#a)"/>
<rect class="dec" x="40" y="316" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="342.0" text-anchor="middle">admin command and not an admin?</text>
<path class="ln" d="M420,338 L470,338" marker-end="url(#a)"/>
<text class="ts" x="442" y="332" text-anchor="middle">yes</text>
<rect class="bad" x="470" y="320" width="190" height="36" rx="2"/>
<text class="tb1" x="565.0" y="342.0" text-anchor="middle">denied (exit 4)</text>
<path class="ln" d="M230.0,360 L230.0,380" marker-end="url(#a)"/>
<rect class="dec" x="40" y="380" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="406.0" text-anchor="middle">Pending account, command not allowed?</text>
<path class="ln" d="M420,402 L470,402" marker-end="url(#a)"/>
<text class="ts" x="442" y="396" text-anchor="middle">yes</text>
<rect class="bad" x="470" y="384" width="190" height="36" rx="2"/>
<text class="tb1" x="565.0" y="406.0" text-anchor="middle">denied (exit 4)</text>
<path class="ln" d="M230.0,424 L230.0,444" marker-end="url(#a)"/>
<rect class="dec" x="40" y="444" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="470.0" text-anchor="middle">Write budget exhausted?</text>
<path class="ln" d="M420,466 L470,466" marker-end="url(#a)"/>
<text class="ts" x="442" y="460" text-anchor="middle">yes</text>
<rect class="bad" x="470" y="448" width="190" height="36" rx="2"/>
<text class="tb1" x="565.0" y="470.0" text-anchor="middle">refused, try later</text>
<path class="ln" d="M230.0,488 L230.0,508" marker-end="url(#a)"/>
<rect class="gb" x="40" y="508" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="534.0" text-anchor="middle">Handler: resolveRepo(path, predicate)</text>
<path class="ln" d="M230.0,552 L230.0,572" marker-end="url(#a)"/>
<rect class="dec" x="40" y="572" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="598.0" text-anchor="middle">Repository exists?</text>
<path class="ln" d="M420,594 L470,594" marker-end="url(#a)"/>
<text class="ts" x="442" y="588" text-anchor="middle">no</text>
<rect class="bad" x="470" y="576" width="190" height="36" rx="2"/>
<text class="tb1" x="565.0" y="598.0" text-anchor="middle">not found (exit 3)</text>
<path class="ln" d="M230.0,616 L230.0,636" marker-end="url(#a)"/>
<rect class="dec" x="40" y="636" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="662.0" text-anchor="middle">Predicate passes? (CanRead / CanWrite / CanAdmin)</text>
<path class="ln" d="M230.0,680 L230.0,716" marker-end="url(#a)"/>
<text class="ts" x="238.0" y="702" text-anchor="start">no</text>
<rect class="dec" x="40" y="716" width="380" height="44" rx="2"/>
<text class="tb1" x="230.0" y="742.0" text-anchor="middle">Caller can read it?</text>
<path class="ln" d="M420,658 L470,658" marker-end="url(#a)"/>
<text class="ts" x="442" y="652" text-anchor="middle">yes</text>
<rect class="ok" x="470" y="638" width="190" height="40" rx="2"/>
<text class="tb1" x="565.0" y="662.0" text-anchor="middle">run · audit if it wrote</text>
<path class="ln" d="M420,728 L470,716" marker-end="url(#a)"/>
<text class="ts" x="440" y="716" text-anchor="middle">no</text>
<rect class="bad" x="470" y="698" width="190" height="34" rx="2"/>
<text class="tb1" x="565.0" y="719.0" text-anchor="middle">not found (exit 3)</text>
<path class="ln" d="M420,748 L470,760" marker-end="url(#a)"/>
<text class="ts" x="440" y="768" text-anchor="middle">yes</text>
<rect class="bad" x="470" y="744" width="190" height="34" rx="2"/>
<text class="tb1" x="565.0" y="765.0" text-anchor="middle">permission denied (exit 4)</text>
<text class="tb1" x="690" y="76" text-anchor="start">git transport (runGit)</text>
<rect class="dec" x="690" y="92" width="250" height="52" rx="2"/>
<text class="tb1" x="815.0" y="114.0" text-anchor="middle">Deploy key?</text>
<text class="ts" x="815.0" y="130.0" text-anchor="middle">yes: only its repository and mode</text>
<path class="ln" d="M815.0,144 L815.0,162" marker-end="url(#a)"/>
<rect class="dec" x="690" y="162" width="250" height="52" rx="2"/>
<text class="tb1" x="815.0" y="184.0" text-anchor="middle">CanRead?</text>
<text class="ts" x="815.0" y="200.0" text-anchor="middle">no: not found</text>
<path class="ln" d="M815.0,214 L815.0,232" marker-end="url(#a)"/>
<rect class="dec" x="690" y="232" width="250" height="52" rx="2"/>
<text class="tb1" x="815.0" y="254.0" text-anchor="middle">Key scope allows git?</text>
<text class="ts" x="815.0" y="270.0" text-anchor="middle">runner: read only · else denied</text>
<path class="ln" d="M815.0,284 L815.0,302" marker-end="url(#a)"/>
<rect class="dec" x="690" y="302" width="250" height="52" rx="2"/>
<text class="tb1" x="815.0" y="324.0" text-anchor="middle">Push: CanWrite?</text>
<text class="ts" x="815.0" y="340.0" text-anchor="middle">no: denied</text>
<path class="ln" d="M815.0,354 L815.0,372" marker-end="url(#a)"/>
<rect class="dec" x="690" y="372" width="250" height="52" rx="2"/>
<text class="tb1" x="815.0" y="394.0" text-anchor="middle">Archived, pull mirror, quota</text>
<text class="ts" x="815.0" y="410.0" text-anchor="middle">refused</text>
<path class="ln" d="M815.0,424 L815.0,442" marker-end="url(#a)"/>
<rect class="gb" x="690" y="442" width="250" height="52" rx="2"/>
<text class="tb1" x="815.0" y="464.0" text-anchor="middle">pre-receive: CheckPush</text>
<text class="ts" x="815.0" y="480.0" text-anchor="middle">protected · require-mr · tags</text>
<path class="ln" d="M815.0,494 L815.0,512" marker-end="url(#a)"/>
<rect class="gb" x="690" y="512" width="250" height="52" rx="2"/>
<text class="tb1" x="815.0" y="534.0" text-anchor="middle">require-signed</text>
<text class="ts" x="815.0" y="550.0" text-anchor="middle">verify each incoming commit</text>
<path class="ln" d="M815.0,564 L815.0,582" marker-end="url(#a)"/>
<rect class="ok" x="690" y="582" width="250" height="52" rx="2"/>
<text class="tb1" x="815.0" y="612.0" text-anchor="middle">git applies the ref updates</text>
<text class="ts" x="690" y="680" text-anchor="start">Merges by the server skip the hooks:</text>
<text class="ts" x="690" y="696" text-anchor="start">MergeGates decides them, and require-signed</text>
<text class="ts" x="690" y="712" text-anchor="start">allows only fast-forward merges, so the</text>
<text class="ts" x="690" y="728" text-anchor="start">server never writes an unsigned commit.</text>
<rect class="dec" x="28" y="824" width="18" height="14" rx="2"/>
<text class="ts" x="52" y="835" text-anchor="start">check</text>
<rect class="gb" x="93.0" y="824" width="18" height="14" rx="2"/>
<text class="ts" x="117.0" y="835" text-anchor="start">step</text>
<rect class="bad" x="151.8" y="824" width="18" height="14" rx="2"/>
<text class="ts" x="175.8" y="835" text-anchor="start">refusal</text>
<rect class="ok" x="229.20000000000002" y="824" width="18" height="14" rx="2"/>
<text class="ts" x="253.20000000000002" y="835" text-anchor="start">allowed</text>
</svg>
