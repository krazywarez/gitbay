<rect class="bg" x="0" y="0" width="970" height="680"/>
<text class="th" x="28" y="36">2. Components inside gitbayd</text>
<rect class="gb" x="40" y="70" width="250" height="64" rx="2"/>
<text class="tb1" x="165.0" y="98.0" text-anchor="middle">internal/sshd</text>
<text class="ts" x="165.0" y="114.0" text-anchor="middle">SSH :22 · key auth · exec · git transport</text>
<rect class="gb" x="310" y="70" width="330" height="64" rx="2"/>
<text class="tb1" x="475.0" y="98.0" text-anchor="middle">internal/httpd</text>
<text class="ts" x="475.0" y="114.0" text-anchor="middle">web · JSON API · smart HTTP (fetch) · LFS</text>
<rect class="gb" x="660" y="70" width="270" height="64" rx="2"/>
<text class="tb1" x="795.0" y="98.0" text-anchor="middle">internal/gitd</text>
<text class="ts" x="795.0" y="114.0" text-anchor="middle">git:// · upload-pack · off by default</text>
<rect class="gb" x="40" y="190" width="600" height="80" rx="2"/>
<text class="tb1" x="340.0" y="218.0" text-anchor="middle">internal/control: the command registry</text>
<text class="ts" x="340.0" y="234.0" text-anchor="middle">Dispatch: scope · read-only · disabled · admin · pending · write budget</text>
<text class="ts" x="340.0" y="250.0" text-anchor="middle">stdin gating · handler · audit of successful writes</text>
<rect class="gb" x="660" y="190" width="270" height="80" rx="2"/>
<text class="tb1" x="795.0" y="218.0" text-anchor="middle">internal/policy</text>
<text class="ts" x="795.0" y="234.0" text-anchor="middle">CanRead / CanWrite / CanAdmin</text>
<text class="ts" x="795.0" y="250.0" text-anchor="middle">key scopes · CheckPush · CODEOWNERS</text>
<rect class="gb" x="40" y="320" width="180" height="70" rx="2"/>
<text class="tb1" x="130.0" y="343.0" text-anchor="middle">internal/hookd</text>
<text class="ts" x="130.0" y="359.0" text-anchor="middle">pre- and post-receive</text>
<text class="ts" x="130.0" y="375.0" text-anchor="middle">decisions</text>
<rect class="gb" x="240" y="320" width="190" height="70" rx="2"/>
<text class="tb1" x="335.0" y="343.0" text-anchor="middle">internal/gitutil</text>
<text class="ts" x="335.0" y="359.0" text-anchor="middle">git as a subprocess</text>
<text class="ts" x="335.0" y="375.0" text-anchor="middle">argv only, no shell</text>
<rect class="gb" x="450" y="320" width="190" height="70" rx="2"/>
<text class="tb1" x="545.0" y="343.0" text-anchor="middle">internal/sig</text>
<text class="ts" x="545.0" y="359.0" text-anchor="middle">OpenPGP and SSHSIG</text>
<text class="ts" x="545.0" y="375.0" text-anchor="middle">verification only</text>
<rect class="gb" x="660" y="320" width="270" height="70" rx="2"/>
<text class="tb1" x="795.0" y="343.0" text-anchor="middle">internal/store</text>
<text class="ts" x="795.0" y="359.0" text-anchor="middle">SQLite · hand-written SQL</text>
<text class="ts" x="795.0" y="375.0" text-anchor="middle">59 migrations</text>
<rect class="gb" x="40" y="440" width="600" height="70" rx="2"/>
<text class="tb1" x="340.0" y="463.0" text-anchor="middle">background workers</text>
<text class="ts" x="340.0" y="479.0" text-anchor="middle">webhook delivery · mail · APNs · mirrors</text>
<text class="ts" x="340.0" y="495.0" text-anchor="middle">CI scheduler and stale-build reaper · dependency checks · retention sweep</text>
<rect class="gb" x="800" y="440" width="130" height="70" rx="2"/>
<text class="tb1" x="865.0" y="463.0" text-anchor="middle">internal/lfs</text>
<text class="ts" x="865.0" y="479.0" text-anchor="middle">content-addressed</text>
<text class="ts" x="865.0" y="495.0" text-anchor="middle">HMAC tokens</text>
<rect class="st" x="40" y="570" width="180" height="50" rx="2"/>
<text class="tb1" x="130.0" y="591.0" text-anchor="middle">hook.sock</text>
<text class="ts" x="130.0" y="607.0" text-anchor="middle">unix socket</text>
<rect class="st" x="240" y="570" width="190" height="50" rx="2"/>
<text class="tb1" x="335.0" y="591.0" text-anchor="middle">repos/*.git</text>
<text class="ts" x="335.0" y="607.0" text-anchor="middle">bare repositories</text>
<rect class="st" x="660" y="570" width="120" height="50" rx="2"/>
<text class="tb1" x="720.0" y="591.0" text-anchor="middle">gitbay.db</text>
<text class="ts" x="720.0" y="607.0" text-anchor="middle">SQLite, 0640</text>
<rect class="st" x="800" y="570" width="130" height="50" rx="2"/>
<text class="tb1" x="865.0" y="591.0" text-anchor="middle">lfs/</text>
<text class="ts" x="865.0" y="607.0" text-anchor="middle">objects</text>
